[tool.poetry]
name = "telegram-whisper-bot"
version = "0.3.0"
description = "Telegram bot for Russian audio transcription via AssemblyAI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pyrogram = "^2.0"
tgcrypto = "^1.2"
httpx = "^0.27.0"
pydub = "^0.25.1"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.8.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
